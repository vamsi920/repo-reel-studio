<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Neo design tokens. The splash renders before the frontend is served,
       so it cannot import the app's CSS — these mirror src/tailwind.css.
       Keep in sync. */
    :root {
      --oh-background: #0b0e14; /* cool-grey-950 */
      --oh-foreground: #eef2f7; /* cool-grey-100 */
      --oh-muted: #a3b0c4; /* cool-grey-400 */
      --oh-text-dim: #7e8a9e; /* cool-grey-500 */
      --oh-text-subtle: #626d82; /* cool-grey-600 */
      --oh-border: #4b5468; /* cool-grey-700 */
      --oh-border-subtle: #383f50; /* cool-grey-800 */
      --oh-surface-deep: #05070a; /* cool-grey-975 */
      --oh-color-danger: #e76a5e;
      --oh-color-primary: #0b81b7;
      --oh-accent: #27867d;
      --brand-glow: #2ab2ee;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--oh-background);
      font-family:
        -apple-system, "SF Pro", BlinkMacSystemFont, "Segoe UI", "Roboto",
        "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
        "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: var(--oh-foreground);
      user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── Ambient backdrop ─────────────────────────────────────────────── */
    .backdrop {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .backdrop::before {
      /* brand glow, top-left */
      content: "";
      position: absolute;
      width: 520px; height: 520px;
      left: -180px; top: -260px;
      background: radial-gradient(circle, rgba(11,129,183,0.38) 0%, rgba(11,129,183,0) 62%);
      animation: drift 9s ease-in-out infinite alternate;
    }
    .backdrop::after {
      /* teal glow, bottom-right */
      content: "";
      position: absolute;
      width: 460px; height: 460px;
      right: -200px; bottom: -240px;
      background: radial-gradient(circle, rgba(39,134,125,0.28) 0%, rgba(39,134,125,0) 62%);
      animation: drift 11s ease-in-out infinite alternate-reverse;
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 28px 28px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 42%, #000 0%, transparent 70%);
      mask-image: radial-gradient(ellipse at 50% 42%, #000 0%, transparent 70%);
    }
    @keyframes drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to   { transform: translate3d(28px, 18px, 0) scale(1.08); }
    }

    /* ── Hero block ───────────────────────────────────────────────────── */
    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Must equal the collapsed window height (LOADING_WIN_HEIGHT in
         main.mjs): the block keeps its layout when the window grows to
         reveal the startup-log console below it. */
      height: 380px;
      flex: none;
    }

    .logo-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 18px;
    }
    .logo-halo {
      position: absolute;
      inset: -34px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(42,178,238,0.45) 0%, rgba(42,178,238,0) 60%);
      opacity: 0;
      animation: halo-in 1.1s cubic-bezier(.2,.7,.2,1) 0.55s forwards,
                 halo-breathe 3.2s ease-in-out 1.7s infinite;
    }
    @keyframes halo-in { to { opacity: 1; } }
    @keyframes halo-breathe {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50%      { transform: scale(1.12); opacity: 1; }
    }

    .logo {
      position: relative;
      width: 96px;
      height: 96px;
      display: block;
      -webkit-user-drag: none;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,0.45));
    }
    /* Squircle tile scales in first. */
    .tile {
      transform-origin: 50% 50%;
      transform: scale(0.72);
      opacity: 0;
      animation: tile-in 0.75s cubic-bezier(.2,.9,.25,1.15) 0.05s forwards;
    }
    @keyframes tile-in { to { transform: scale(1); opacity: 1; } }

    /* The arch mark is a single round-capped stroke that draws on from the
       left foot, over the top, down to the right foot — same geometry as the
       filled mark in build-resources/brand/neo-mark.svg. */
    .arch {
      fill: none;
      stroke: #ffffff;
      stroke-width: 67;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1100;
      stroke-dashoffset: 1100;
      animation: draw 1.05s cubic-bezier(.65,.05,.25,1) 0.42s forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* Shimmer sweep across the mark once drawn. */
    .shine {
      opacity: 0;
      animation: shine 1.4s ease-in-out 1.45s forwards;
    }
    @keyframes shine {
      0%   { opacity: 0; transform: translateX(-620px) skewX(-18deg); }
      18%  { opacity: 0.9; }
      100% { opacity: 0; transform: translateX(620px) skewX(-18deg); }
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.6px;
      margin-bottom: 6px;
      color: var(--oh-foreground);
      display: flex;
      gap: 0.5px;
    }
    h1 span {
      display: inline-block;
      opacity: 0;
      transform: translateY(10px);
      filter: blur(6px);
      animation: letter-in 0.6s cubic-bezier(.2,.8,.2,1) forwards;
    }
    h1 span:nth-child(1) { animation-delay: 0.95s; }
    h1 span:nth-child(2) { animation-delay: 1.05s; }
    h1 span:nth-child(3) { animation-delay: 1.15s; }
    @keyframes letter-in {
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .tagline {
      font-size: 13px;
      color: var(--oh-muted);
      margin-bottom: 30px;
      opacity: 0;
      animation: fade-up 0.7s ease-out 1.35s forwards;
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Slim indeterminate progress bar (replaces the old spinner). */
    .progress {
      position: relative;
      width: 220px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      margin-bottom: 14px;
      opacity: 0;
      animation: fade-up 0.6s ease-out 1.6s forwards;
    }
    .progress::before {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 44%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(42,178,238,0) 0%, var(--brand-glow) 40%, var(--oh-color-primary) 100%);
      animation: sweep 1.6s cubic-bezier(.4,0,.2,1) 1.8s infinite;
    }
    @keyframes sweep {
      from { left: -46%; }
      to   { left: 102%; }
    }

    .status {
      font-size: 12px;
      color: var(--oh-text-dim);
      letter-spacing: 0.2px;
      /* Long lines (e.g. uvx "Installing openhands-agent-server==1.24.0…")
         must not push the window or wrap awkwardly. */
      max-width: 380px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      animation: fade-up 0.6s ease-out 1.7s forwards;
    }

    .hint {
      margin-top: 12px;
      font-size: 11px;
      color: var(--oh-text-subtle);
      letter-spacing: 0.2px;
      max-width: 340px;
      text-align: center;
      line-height: 1.5;
      opacity: 0;
      animation: fade-up 0.7s ease-out 2.1s forwards;
    }

    /* Progress dots animation for status text */
    .dots::after {
      content: "";
      animation: dots 1.5s steps(3, end) infinite;
    }
    @keyframes dots {
      0%   { content: ""; }
      33%  { content: "."; }
      66%  { content: ".."; }
      100% { content: "..."; }
    }

    .actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      -webkit-app-region: no-drag;
      opacity: 0;
      animation: fade-up 0.6s ease-out 2.3s forwards;
    }

    .ghost-button {
      font: inherit;
      font-size: 11px;
      padding: 4px 12px;
      color: var(--oh-muted);
      background: transparent;
      border: 1px solid var(--oh-border);
      border-radius: 8px;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: background 120ms ease, color 120ms ease;
    }
    .ghost-button:hover {
      color: var(--oh-foreground);
      background: rgba(255, 255, 255, 0.06);
    }

    .version {
      position: absolute;
      right: 14px;
      bottom: 10px;
      font-size: 10px;
      color: var(--oh-text-subtle);
      letter-spacing: 0.3px;
      opacity: 0;
      animation: fade-up 0.8s ease-out 2.4s forwards;
    }

    /* ── Startup-log console ─────────────────────────────────────────────
       Fills the extra height revealed by "Show details" (the window grows —
       see setLoadingWindowExpanded in main.mjs); zero-height and clipped
       while the window is collapsed. Interactive: opts out of the window
       drag region and re-enables text selection. */
    .console {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin: 0 16px 16px;
      background: var(--oh-surface-deep);
      border: 1px solid var(--oh-border-subtle);
      border-radius: 8px;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }

    .console-head {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 6px 5px 12px;
      border-bottom: 1px solid var(--oh-border-subtle);
      font-size: 11px;
      color: var(--oh-muted);
    }

    .log {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 12px;
      /* The app's `code` stack (src/index.css). */
      font-family:
        source-code-pro, Menlo, Monaco, Consolas, "Courier New", monospace;
      font-size: 10.5px;
      line-height: 1.55;
      color: var(--oh-text-dim);
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
      /* Full lines, never truncated — long uvx/pip output wraps. */
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .log:empty::before {
      content: "Waiting for output…";
      color: var(--oh-text-subtle);
    }

    .log-name {
      color: var(--oh-text-subtle);
    }
    .log-line-error {
      color: var(--oh-color-danger);
    }

    /* ── Failure state (main.mjs::showStartupFailure) ──────────────────── */
    body.failed .progress,
    body.failed .logo-halo {
      display: none;
    }
    body.failed .status {
      color: var(--oh-color-danger);
      /* The full error summary matters more than a tidy single line here. */
      white-space: normal;
      line-height: 1.45;
      opacity: 1;
      animation: none;
    }
    body.failed .hint {
      display: none;
    }
    body.failed .actions {
      opacity: 1;
      animation: none;
    }
    .quit-button,
    .retry-button,
    .switch-button {
      display: none;
    }
    body.failed .quit-button,
    body.failed .retry-button,
    body.failed .switch-button {
      display: inline-block;
    }
    /* Remote mode: nothing is installed, so the first-run hint is noise. */
    body.remote .hint {
      display: none;
    }

    /* ── Reduced motion: land on the finished frame immediately ────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001s !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
      }
      .progress::before { left: 28%; }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="grid"></div></div>
  <div class="container">
    <div class="logo-wrap" aria-hidden="true">
      <div class="logo-halo"></div>
      <svg class="logo" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="tile-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1596d4"/>
            <stop offset="0.55" stop-color="#0b6fa3"/>
            <stop offset="1" stop-color="#053a5a"/>
          </linearGradient>
          <radialGradient id="tile-glow" cx="0.22" cy="0.12" r="0.9">
            <stop offset="0" stop-color="#5fd0ff" stop-opacity="0.75"/>
            <stop offset="0.45" stop-color="#2ab2ee" stop-opacity="0.18"/>
            <stop offset="1" stop-color="#2ab2ee" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="tile-gloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="shine-grad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <clipPath id="tile-clip">
            <rect x="0" y="0" width="1024" height="1024" rx="230"/>
          </clipPath>
          <clipPath id="arch-clip">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M394 152H630C822.278 152 978 307.722 978 500V872C978 905.137 951.137 932 918 932C884.863 932 858 905.137 858 872V500C858 373.452 755.548 271 630 271H394C267.452 271 165 373.452 165 500V872C165 905.137 138.137 932 105 932C71.8629 932 45 905.137 45 872V500C45 307.722 200.722 152 394 152Z" transform="translate(227 302) scale(0.557) translate(0 -152)"/>
          </clipPath>
        </defs>
        <g class="tile">
          <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#tile-bg)"/>
          <g clip-path="url(#tile-clip)">
            <rect width="1024" height="1024" fill="url(#tile-glow)"/>
            <rect width="1024" height="512" fill="url(#tile-gloss)"/>
            <rect x="4" y="4" width="1016" height="1016" rx="226" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="6"/>
          </g>
          <!-- Centre-line of the filled mark above (stroke 67 = mark thickness). -->
          <path class="arch"
            d="M285.5 703 V496.1 A160.7 160.7 0 0 1 446.2 335.4 H577.6 A160.7 160.7 0 0 1 738.3 496.1 V703"/>
          <g clip-path="url(#arch-clip)">
            <rect class="shine" x="200" y="280" width="200" height="480" fill="url(#shine-grad)"/>
          </g>
        </g>
      </svg>
    </div>
    <h1 aria-label="Neo"><span>N</span><span>e</span><span>o</span></h1>
    <p class="tagline">AI coding agents, on your Mac</p>
    <div class="progress" aria-hidden="true"></div>
    <p id="status" class="status">Connecting to Neo<span class="dots"></span></p>
    <p class="hint">
      First launch downloads Python + the agent server.<br />
      This can take a few minutes on a fresh machine.
    </p>
    <div class="actions">
      <button id="retry-button" type="button" class="ghost-button retry-button">
        Try again
      </button>
      <button id="switch-button" type="button" class="ghost-button switch-button">
        Use local agent server
      </button>
      <button id="details-toggle" type="button" class="ghost-button">
        Show details
      </button>
      <button id="quit-button" type="button" class="ghost-button quit-button">
        Quit
      </button>
    </div>
    <span id="version" class="version"></span>
  </div>
  <div class="console" aria-label="Startup log">
    <div class="console-head">
      <span>Startup log</span>
      <button id="copy-logs" type="button" class="ghost-button">Copy</button>
    </div>
    <div id="log" class="log"></div>
  </div>
  <script>
    // Called from the Electron main process via webContents.executeJavaScript
    // (see electron/main.mjs::setLoadingStatus). Replaces the entire status
    // line, so the animated dots only appear when no concrete status is set.
    window.__setLoadingStatus = function (line) {
      var el = document.getElementById("status");
      if (!el) return;
      var text = String(line == null ? "" : line);
      el.textContent = text || "";
    };

    // ── Startup-log console ──────────────────────────────────────────────
    // Fed by the main process over IPC via preload.cjs (window.desktopBoot);
    // undefined when the file is opened outside Electron, so every use is
    // guarded and the static layout stays previewable in a plain browser.
    // All DOM insertion uses textContent — log lines are untrusted process
    // output and must never be parsed as HTML.
    (function () {
      var boot = window.desktopBoot;
      var logEl = document.getElementById("log");
      var statusEl = document.getElementById("status");
      var toggleBtn = document.getElementById("details-toggle");
      var copyBtn = document.getElementById("copy-logs");
      var quitBtn = document.getElementById("quit-button");
      var retryBtn = document.getElementById("retry-button");
      var switchBtn = document.getElementById("switch-button");
      var versionEl = document.getElementById("version");

      if (boot && typeof boot.version === "string" && boot.version) {
        versionEl.textContent = "v" + boot.version;
      }
      // Mode-specific copy: remote mode connects to the hosted Neo, local
      // mode installs and starts the stack here.
      var mode = boot && boot.mode === "local" ? "local" : "remote";
      document.body.classList.add(mode);
      statusEl.firstChild.nodeValue =
        mode === "local" ? "Starting the local agent server" : "Connecting to Neo";
      switchBtn.textContent =
        mode === "local" ? "Use Neo Cloud instead" : "Use local agent server";

      // Cap DOM rows so an hours-long install can't grow layout cost;
      // matches the main process's BOOT_LOG_MAX_LINES buffer cap.
      var MAX_LINES = 2000;
      var expanded = false;
      // Follow the tail only while the user hasn't scrolled up.
      var pinned = true;

      logEl.addEventListener("scroll", function () {
        pinned =
          logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 8;
      });

      function appendBatch(batch) {
        if (!batch || !batch.length) return;
        var frag = document.createDocumentFragment();
        for (var i = 0; i < batch.length; i++) {
          var entry = batch[i];
          var row = document.createElement("div");
          row.className =
            "log-line" + (entry.level === "error" ? " log-line-error" : "");
          var name = document.createElement("span");
          name.className = "log-name";
          name.textContent = "[" + entry.name + "]";
          row.appendChild(name);
          row.appendChild(document.createTextNode(" " + entry.line));
          frag.appendChild(row);
        }
        logEl.appendChild(frag);
        while (logEl.childElementCount > MAX_LINES) {
          logEl.removeChild(logEl.firstElementChild);
        }
        if (pinned) logEl.scrollTop = logEl.scrollHeight;
      }

      function setExpanded(next) {
        expanded = next;
        toggleBtn.textContent = expanded ? "Hide details" : "Show details";
        if (boot) boot.setDetailsExpanded(expanded);
        if (expanded && pinned) logEl.scrollTop = logEl.scrollHeight;
      }

      toggleBtn.addEventListener("click", function () {
        setExpanded(!expanded);
      });

      copyBtn.addEventListener("click", function () {
        if (!boot) return;
        boot.copyLogs().then(function () {
          copyBtn.textContent = "Copied";
          setTimeout(function () {
            copyBtn.textContent = "Copy";
          }, 1200);
        });
      });

      quitBtn.addEventListener("click", function () {
        if (boot) boot.quit();
      });
      retryBtn.addEventListener("click", function () {
        if (boot) boot.retry();
      });
      switchBtn.addEventListener("click", function () {
        if (boot) boot.switchMode(mode === "local" ? "remote" : "local");
      });

      if (boot) {
        boot.onLogBatch(appendBatch);
        boot.onFatal(function (summary) {
          document.body.classList.add("failed");
          statusEl.textContent = String(summary == null ? "" : summary);
          // Main already resized the window; sync the local toggle state.
          if (!expanded) setExpanded(true);
        });
      }
    })();
  </script>
</body>
</html>
