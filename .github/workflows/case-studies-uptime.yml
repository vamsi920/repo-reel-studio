name: Case studies uptime

# Fails (and GitHub emails the repo owner) when the published case-studies
# site stops resolving, stops serving, or is missing a study listed in
# case-studies/site/modules.json.
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "case-studies/site/**"
      - "case-studies/check-live.mjs"
      - ".github/workflows/case-studies-uptime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check every address and every study
        run: node case-studies/check-live.mjs
