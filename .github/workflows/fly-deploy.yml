name: Deploy to Fly.io

# Redeploying the agent server restarts its only machine, which drops every
# live conversation socket (and, with no volume, the conversations
# themselves). A frontend-only push used to do exactly that mid-migration, so
# each app now deploys only when files that go into its image changed.
# The frontend users see is served by Netlify; the copy baked into the agent
# server image (/canvas) is refreshed on the next backend deploy.
# workflow_dispatch deploys both unconditionally.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      agent_server: ${{ steps.diff.outputs.agent_server }}
      deepwiki: ${{ steps.diff.outputs.deepwiki }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] \
            || [ -z "$BEFORE" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "agent_server=true" >> "$GITHUB_OUTPUT"
            echo "deepwiki=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          echo "$changed"
          # Everything docker/Dockerfile copies into the agent-server image,
          # plus its Fly config and this workflow.
          if echo "$changed" | grep -qE '^(docker/|scripts/|config/|tools/|vendor/agentops/|fly\.agent-server\.toml$|package\.json$|package-lock\.json$|\.github/workflows/fly-deploy\.yml$)'; then
            echo "agent_server=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent_server=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(vendor/deepwiki-open/|\.github/workflows/fly-deploy\.yml$)'; then
            echo "deepwiki=true" >> "$GITHUB_OUTPUT"
          else
            echo "deepwiki=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-agent-server:
    name: Deploy Agent Server
    needs: changes
    if: needs.changes.outputs.agent_server == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-neo-agent-server
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config fly.agent-server.toml --app neo-agent-server --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-deepwiki:
    name: Deploy DeepWiki
    needs: changes
    if: needs.changes.outputs.deepwiki == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-neo-deepwiki
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config fly.toml --app neo-deepwiki --remote-only --ha=false
        working-directory: vendor/deepwiki-open
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEEPWIKI }}
