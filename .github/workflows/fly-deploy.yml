name: Deploy Agent Server to Fly.io

on:
  push:
    branches: [main]

concurrency:
  group: fly-deploy-neo-agent-server
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config fly.agent-server.toml --app neo-agent-server --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
