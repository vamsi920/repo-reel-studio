<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitFlick | Repo to Reel</title>
    <meta name="description" content="Transform your GitHub repository into an engaging onboarding video in seconds. Let AI analyze your codebase and generate visual architectural walkthroughs automatically." />
    <meta name="author" content="GitFlick" />
    <meta name="keywords" content="GitHub, onboarding, video, documentation, AI, code walkthrough, developer tools" />

    <meta property="og:title" content="GitFlick | Repo to Reel" />
    <meta property="og:description" content="Stop writing stale documentation. Let AI analyze your codebase and generate a visual architectural walkthrough automatically." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@gitflick" />
    <meta name="twitter:image" content="/icon.png" />

    <link rel="icon" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>

  <body>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #0a0a0f; color: #f5f5f5; }
      #boot-status { padding: 24px; font: 14px/1.5 system-ui, sans-serif; color: #a3a3a3; }
      #boot-error {
        display: none;
        margin: 24px;
        padding: 16px;
        border: 1px solid #7f1d1d;
        border-radius: 12px;
        background: #1a0a0a;
        color: #fecaca;
        font: 14px/1.5 system-ui, sans-serif;
        white-space: pre-wrap;
      }
    </style>
    <div id="root"><div id="boot-status">Loading GitFlick…</div></div>
    <div id="boot-error"></div>
    <script>
      window.addEventListener("error", function (event) {
        var el = document.getElementById("boot-error");
        if (!el) return;
        el.style.display = "block";
        el.textContent = "App failed to load:\\n" + (event.message || "Unknown error");
      });
      window.addEventListener("unhandledrejection", function (event) {
        var el = document.getElementById("boot-error");
        if (!el) return;
        el.style.display = "block";
        var reason = event.reason && (event.reason.message || String(event.reason));
        el.textContent = "App failed to load:\\n" + (reason || "Unhandled promise rejection");
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
