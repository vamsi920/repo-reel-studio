# Fly.io configuration for the vendored DeepWiki service (powers the
# Knowledge/"KT" tab in the main app). Separate app from both the agent
# server (fly.agent-server.toml) and the legacy ingestion backend (fly.toml).
app = "neo-deepwiki"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8001"
  NODE_ENV = "production"
  DEEPWIKI_EMBEDDER_TYPE = "google"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
